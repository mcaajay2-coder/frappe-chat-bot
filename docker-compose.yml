# ==============================================================================
# KOINONIA ASSISTANT - FULL STACK DOCKER COMPOSE DEPLOYMENT
# ==============================================================================
# Usage:
#   docker compose up -d
# Access:
#   Web Assistant: http://localhost:8081/koinonia-chat
#   Frappe Desk:   http://localhost:8081/app
# ==============================================================================

name: koinonia

services:
  backend:
    image: frappe/erpnext:v16.29.0
    restart: unless-stopped
    networks:
      - frappe_network
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      GROQ_API_KEYS: ${GROQ_API_KEYS}
      PG_HOST: postgres-vector
      PG_PORT: "5432"
      PG_DB: parish_vectordb
      PG_USER: postgres
      PG_PASS: password
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:v16.29.0
    restart: "no"
    networks:
      - frappe_network
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:v16.29.0
    restart: "no"
    networks:
      - frappe_network
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 postgres-vector:5432;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created...";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "Timeout waiting for common_site_config.json";
            exit 1;
          fi
        done;
        echo "common_site_config.json found!";
        if [ ! -d "apps/koinonia_assistant" ]; then
          bench get-app https://github.com/mcaajay2-coder/frappe-chat-bot.git;
        fi;
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists. Running migration and setup...";
          bench --site frontend migrate;
          bench --site frontend execute koinonia_assistant.setup.seed_sample_data || true;
        else
          echo "Creating site frontend...";
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app erpnext --install-app koinonia_assistant --set-default frontend;
          if [ -n "$$SARVAM_API_KEY" ]; then
            bench --site frontend set-config sarvam_api_key "$$SARVAM_API_KEY";
          fi;
          bench --site frontend set-config pg_host "postgres-vector";
          bench --site frontend set-config pg_db "parish_vectordb";
          bench --site frontend set-config pg_user "postgres";
          bench --site frontend set-config pg_pass "password";
          bench --site frontend execute koinonia_assistant.setup.seed_sample_data || true;
        fi;
    environment:
      SARVAM_API_KEY: ${SARVAM_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy

  db:
    image: mariadb:11.8
    restart: unless-stopped
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  postgres-vector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parish_vectordb"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: parish_vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    image: frappe/erpnext:v16.29.0
    restart: unless-stopped
    networks:
      - frappe_network
    depends_on:
      - websocket
      - backend
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8081:8080"

  queue-long:
    image: frappe/erpnext:v16.29.0
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:v16.29.0
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe_network
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe_network
    volumes:
      - redis-queue-data:/data

  scheduler:
    image: frappe/erpnext:v16.29.0
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:v16.29.0
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  pgdata:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
